{% extends "base.html" %}
{% block title %}Add Transaction - Farm Manager{% endblock %}
{% block content %}
  <h1>Add Transaction</h1>
  <div class="card">
    <form method="POST">
      <div class="field" style="margin-bottom:12px;">
        <label>Type</label>
        <select name="type" required>
          <option value="Income">Income</option>
          <option value="Expense">Expense</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label>Amount</label>
        <input type="number" step="0.01" name="amount" required>
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label>Category</label>
        <input type="text" name="category" placeholder="Feed, Sales, Salary, Medical, Seeds...">
      </div>
      <div class="field" style="margin-bottom:16px;">
        <label>Date</label>
        <input type="date" name="date" required>
      </div>
      <div class="field" style="margin-bottom:16px;">
        <label>Description</label>
        <input type="text" name="description">
      </div>
      <button type="submit" class="btn">Save Transaction</button>
      <a href="{{ url_for('finance') }}" class="btn secondary">Cancel</a>
    </form>
  </div>
{% endblock %}
